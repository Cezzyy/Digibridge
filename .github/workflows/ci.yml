name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A new push to a pull request cancels its run still in progress. Runs on main and develop always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Skip installing Git hooks on the runner.
  HUSKY: 0

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  turbo:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { task: lint, name: Lint }
          - { task: typecheck, name: Typecheck }
          - { task: test, name: Test }
          - { task: build, name: Build }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Turbo replays results for packages whose inputs haven't changed since an earlier run.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ matrix.task }}-${{ github.sha }}
          restore-keys: turbo-${{ matrix.task }}-

      - run: pnpm turbo run ${{ matrix.task }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Fails on high or critical advisories only. Run `pnpm audit` locally to see all of them.
      - run: pnpm audit --audit-level high

  # Runs the gitleaks CLI directly. gitleaks-action builds a commit range that breaks
  # when a push includes the repo's first commit, so this scans the whole history instead.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # To upgrade, change both. The SHA-256 is in the release's checksums.txt.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "${tarball}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Scan every commit
        run: gitleaks git --redact --verbose .

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
