name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its run still in progress. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Skip installing Git hooks on the runner.
  HUSKY: 0

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  turbo:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { task: lint, name: Lint }
          - { task: typecheck, name: Typecheck }
          - { task: test, name: Test }
          - { task: build, name: Build }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Turbo replays results for packages whose inputs haven't changed since an earlier run.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ matrix.task }}-${{ github.sha }}
          restore-keys: turbo-${{ matrix.task }}-

      - run: pnpm turbo run ${{ matrix.task }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Fails on high or critical advisories only. Run `pnpm audit` locally to see all of them.
      - run: pnpm audit --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # to list a pull request's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so every new commit is scanned
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings show in the job summary; PR comments would need write access.
          GITLEAKS_ENABLE_COMMENTS: false

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
