name: Set up pnpm and Node
description: Installs pnpm and Node, then the workspace dependencies. Shared by every CI job.

runs:
  using: composite
  steps:
    # pnpm version comes from "packageManager" in package.json.
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: 25 # same major as local dev
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
