packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (wrangler needs these). Manage with `pnpm approve-builds`.
allowBuilds:
  esbuild: true
  workerd: true

# One version of each shared dependency across the repo.
# Use "catalog:" as the version in a package.json to pick these up.
catalog:
  drizzle-orm: ^0.45.4
  eslint: ^10.13.0
  typescript: ~6.0.3
  wrangler: ^4.156.0
  zod: ^4.6.7
