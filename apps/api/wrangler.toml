name = "digibridge-api"
main = "src/index.ts"
compatibility_date = "2026-10-23"
# postgres.js needs Node's Buffer and crypto on Workers.
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787

# Run the Worker in the database's region (Supabase, AWS ap-south-1) rather than at the edge
# nearest the student: a request then crosses the distance once, instead of once per query.
[placement]
mode = "targeted"
region = "aws:ap-south-1"

# Public settings. .dev.vars overrides these in `wrangler dev`; secrets are set with `wrangler secret put`.
[vars]
SUPABASE_URL = "https://pvjykztyqpuywsccvlqg.supabase.co"
WEB_ORIGIN = "https://digibridge-web.pages.dev"
# The API spec and docs page stay off in production; .dev.vars turns them on locally.
API_DOCS = "false"

# Postgres through Hyperdrive (pooled connection to the Supabase direct connection).
# Locally, wrangler dev uses CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE from apps/api/.env instead.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "cb86ab5ed71c4778886200d6c14a318c"

# Private bucket for question and lesson images, served by the API at /api/v1/media/<key>.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "digibridge-media"

# Rate limits (middleware/rate-limit.ts). Counts are per Cloudflare location and approximate, which
# is enough here: [placement] keeps every request in one region. A period is 10 or 60 seconds only.
# A school lab often reaches the API from one IP, so the per-IP limits leave room for ~60 students
# at once. namespace_id is any number, unique among this account's rate limiters.

# Every /api/v1 request, per IP: a catch-all well above a full lab's traffic.
[[ratelimits]]
name = "API_IP_LIMIT"
namespace_id = "1001"
simple = { limit = 2400, period = 60 }

# Opening a school link (GET /links/{code}), per IP.
[[ratelimits]]
name = "LINK_OPEN_LIMIT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# Joining a school link (POST /links/{code}/respondents), per IP.
[[ratelimits]]
name = "LINK_JOIN_LIMIT"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# Joining a school link, per student number (hashed), across all links.
[[ratelimits]]
name = "STUDENT_NUMBER_LIMIT"
namespace_id = "1004"
simple = { limit = 5, period = 60 }

# Answer saves, per respondent (their token hash or Google account).
[[ratelimits]]
name = "ANSWER_LIMIT"
namespace_id = "1005"
simple = { limit = 120, period = 60 }

# Answer saves, per IP: a lab of students saving at once.
[[ratelimits]]
name = "ANSWER_IP_LIMIT"
namespace_id = "1006"
simple = { limit = 1200, period = 60 }

# Starting, submitting, the SUS and the online profile, per respondent and per action.
[[ratelimits]]
name = "RESPONDENT_ACTION_LIMIT"
namespace_id = "1007"
simple = { limit = 20, period = 60 }

# Closes attempts left past expires_at plus the grace period (index.ts, `scheduled`).
[triggers]
crons = ["*/5 * * * *"]
